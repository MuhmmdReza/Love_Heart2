<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Heart For Her</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <header>
      <h1>Love Heart For Her</h1>
    </header>

    <main id="scene">
      <div class="sparkle-field"></div>
      <div class="message">this is for you</div>
      <div class="hanging-heart">♡</div>

      <div class="heart-wrap" aria-label="Love heart">
        <svg class="heart" viewBox="0 0 300 260" role="img">
          <defs>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9fbe"/>
              <stop offset="48%" stop-color="#d94e7f"/>
              <stop offset="100%" stop-color="#7f244e"/>
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="7" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <path class="heart-glow"
            d="M150 235 C128 215 42 164 42 91 C42 43 96 23 127 54 L150 77 L173 54 C204 23 258 43 258 91 C258 164 172 215 150 235Z"/>
          <path class="heart-base"
            d="M150 235 C128 215 42 164 42 91 C42 43 96 23 127 54 L150 77 L173 54 C204 23 258 43 258 91 C258 164 172 215 150 235Z"/>

          <!-- faceted glass polygons -->
          <g class="facets">
            <polygon points="45,88 78,53 113,64 93,105" />
            <polygon points="78,53 127,54 150,78 113,64" />
            <polygon points="127,54 150,78 143,123 113,64" />
            <polygon points="150,78 173,54 187,64 157,123" />
            <polygon points="173,54 222,53 187,64 150,78" />
            <polygon points="222,53 255,88 207,105 187,64" />
            <polygon points="45,88 93,105 106,149 60,126" />
            <polygon points="93,105 113,64 143,123 106,149" />
            <polygon points="143,123 150,78 157,123 150,184" />
            <polygon points="157,123 187,64 207,105 194,149" />
            <polygon points="207,105 255,88 240,126 194,149" />
            <polygon points="60,126 106,149 150,184 110,202 77,171" />
            <polygon points="194,149 240,126 223,171 190,202 150,184" />
            <polygon points="106,149 143,123 150,184 110,202" />
            <polygon points="157,123 194,149 190,202 150,184" />
            <polygon points="110,202 150,184 190,202 150,235" />
          </g>
        </svg>
      </div>

      <div class="orbit orbit-a"></div>
      <div class="orbit orbit-b"></div>
      <div class="bottom-glow"></div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
